# pyproject.toml
[tool.poetry]
name = "financial-rag-system"
version = "0.1.0"
description = "Production Financial RAG for SEC 10-K/10-Q Filings with Agentic Reflexion & Calibrated Abstention"
authors = ["Deepak J"]
readme = "README.md"
packages = [
    { include = "api" },
    { include = "config" },
    { include = "evaluation" },
    { include = "experiments" },
    { include = "generation" },
    { include = "ingestion" },
    { include = "knowledge_graph" },
    { include = "observability" },
    { include = "query" },
    { include = "retrieval" },
    { include = "scripts" },
    { include = "ui" }
]
[tool.poetry.dependencies]
python          = ">=3.11,<3.13"
requests        = "^2.32.0"
python-dotenv   = "^1.1.0"
beautifulsoup4  = "^4.12.0"
lxml            = ">=6.1.0,<7"
qdrant-client   = "^1.17.1"
rank-bm25       = "^0.2.2"
loguru          = "^0.7.3"
tqdm            = "^4.67.3"
numpy           = "^2.4.4"
tiktoken        = "^0.12.0"
openai          = ">=2.0.0"
tenacity        = "^9.1.4"
flashrank       = "^0.2.9"
fastapi         = ">=0.115.0,<1.0.0"
uvicorn         = {extras = ["standard"], version = ">=0.34.0"}
aiofiles        = ">=23.0.0"   # Required by FastAPI StaticFiles for serving frontend

# ── Observability (NEW) ──────────────────────────────────────────────────────
# prometheus-client: exposes GET /metrics in Prometheus text format.
# The default registry is process-global so no extra setup is needed.
prometheus-client = "^0.20.0"

# ── UI (NEW) ─────────────────────────────────────────────────────────────────
# streamlit: Streamlit chat UI in ui/app.py
streamlit = ">=1.35.0,<2.0.0"

scipy = "^1.17.1"
litellm = "^1.83.14"
google-auth = ">=2.28.0"
redis = "^8.1.0"
opentelemetry-api = "^1.44.0"
opentelemetry-sdk = "^1.44.0"
opentelemetry-exporter-otlp = "^1.44.0"
opentelemetry-instrumentation-fastapi = "^0.65b0"

[tool.poetry.group.dev.dependencies]
ruff                 = "^0.9.0"
pytest               = ">=9.0.3"
pytest-cov = ">=5.0.0"
pre-commit           = "^4.5.1"
mypy                 = "^1.20.0"
bandit               = "^1.9.4"
types-requests       = "^2.33.0.20260408"
types-beautifulsoup4 = "^4.12.0.20250516"
httpx                = ">=0.27.0"   # required by FastAPI's TestClient
pytest-asyncio       = ">=0.24.0"  # for async test functions
pip-audit            = "^2.7.3"    # Dependency vulnerability scanner
vulture = "^2.16"
types-cachetools = "^6.2.0.20260408"

[tool.poetry.scripts]
# Convenience CLI shortcuts
serve        = "scripts.entrypoints:serve_dev"
serve-prod   = "scripts.entrypoints:serve_prod"
ui           = "scripts.entrypoints:run_ui"
inspect-data = "scripts.entrypoints:inspect_data"
export-qdrant = "scripts.entrypoints:export_qdrant"
experiment   = "experiments.retrieval_experiment:_cli_main"



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (common bugs)
    "C4",  # flake8-comprehensions (cleaner list/dict/set)
    "UP",  # pyupgrade (modernize syntax for Python 3.11)
    "N",   # pep8-naming conventions
]
ignore = [
    "E501",   # line too long — handled by ruff-format
    "B008",   # do not perform function calls in default args
    "UP017",  # datetime.UTC requires Python 3.12+; we target 3.11
]

[tool.ruff.lint.per-file-ignores]
"evaluation/drift_detector.py" = ["N803", "N806"]
"tests/test_drift_detector.py" = ["N803", "N806"]

[tool.mypy]
exclude = ["tests"]
python_version        = "3.11"
ignore_missing_imports = true
disallow_untyped_defs  = true
no_strict_optional     = true
pretty                 = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips        = [
    "B101",  # skip assert warnings
    "B104",  # hardcoded 0.0.0.0 bind is intended for docker
    "B106",  # false positive on 'prompt' token type
    "B110",  # try-except-pass used intentionally in safe fallback cascade
    "B112",  # try-except-continue used intentionally in streaming error recovery
    "B301",  # pickle is used intentionally for local BM25 index
    "B403",  # pickle import is used intentionally
    "B404",  # subprocess import is used intentionally in entrypoints
    "B603",  # subprocess without shell=True is safe here
]

[tool.ruff.lint.isort]
known-first-party = ["ingestion", "query", "retrieval", "generation", "evaluation", "api", "config", "ui", "observability", "knowledge_graph"]



[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = [
    "--tb=short",
    "--cov=ingestion",
    "--cov=query",
    "--cov=retrieval",
    "--cov=generation",
    "--cov=evaluation",
    "--cov=api",
    "--cov=config",
    "--cov-report=term-missing",
    "--cov=experiments",
    "--cov=observability",
    "--cov=knowledge_graph",
]
# Note: --cov-fail-under is intentionally left in the CI command only
# so local runs don't fail when you're mid-development below 80%

[tool.coverage.run]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.vulture]
exclude = [".venv", "tests", "poetry.lock"]
