# docker-compose.prod.yml
# Production Enterprise Deployment for EarningsOracle Financial RAG
#
# Key Features:
#   - Nginx API Gateway with SSL termination readiness and SSE streaming support
#   - Private internal network (`rag_internal`): DBs (Qdrant, Redis) are NOT exposed to host
#   - Multi-tenant session state stored in persistent volume
#   - Resource constraints (CPU/Memory limits) on all services
#   - Production health probes across all tiers

services:
  # ── Public Ingress / Reverse Proxy ──────────────────────────────────────────
  gateway:
    image: nginx:1.25-alpine
    container_name: rag_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rag_public
      - rag_internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # ── FastAPI Backend API ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: rag_api
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    volumes:
      - app_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag_internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    command: >
      uvicorn api.main:app
        --host 0.0.0.0
        --port 8000
        --workers 2
        --proxy-headers
        --forwarded-allow-ips "*"

  # ── Vector Database (Qdrant) — Isolated ─────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: rag_qdrant
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - rag_internal
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  # ── Cache & Session Layer (Redis) — Isolated ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - rag_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── Metrics (Prometheus) ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: rag_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_alerts.yml:/etc/prometheus/prometheus_alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - rag_internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── Dashboards (Grafana) ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.1
    container_name: rag_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - rag_public
      - rag_internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  rag_public:
    driver: bridge
  rag_internal:
    driver: bridge
    internal: true

volumes:
  qdrant_data:
  app_data:
  redis_data:
  prometheus_data:
  grafana_data:
